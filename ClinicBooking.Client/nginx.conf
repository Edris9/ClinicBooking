server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPAâ€‘fallback-
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fÃ¶r statiska resurser
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
