name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]      # kör vid push till huvud‑branch
  pull_request:
    branches: [ main, master ]      # kör även för PR‑er

jobs:
  build-test:
    runs-on: ubuntu-latest          # gratis GitHub‑runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  deploy-to-dockerhub:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: docker-credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Hub secrets missing; deployment skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.docker-credentials.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.docker-credentials.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.docker-credentials.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ClinicBooking.API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clinic-booking-api:latest
            ${{ secrets.DOCKER_USERNAME }}/clinic-booking-api:${{ github.sha }}
